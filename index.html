<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Investimentos em Títulos Imobiliários</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #f4f5f7, #ffffff);
      color: #212529;
    }
    .container {
      max-width: 1600px;
      margin-top: 2rem;
    }
    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      background-color: #ffffffc4;
    }
    .card-title {
      font-weight: 700;
      font-size: 1.75rem;
      color: #ff6a00;
    }
    label {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .form-control {
      border-radius: 0.5rem;
      border: 1px solid #ced4da;
    }
    .btn-primary {
      background-color: #ff6a00;
      border: none;
      font-weight: 600;
      border-radius: 0.5rem;
    }
    .btn-primary:hover {
      background-color: #e65c00;
    }
    table {
      margin-top: 1.5rem;
    }
    th {
      background-color: #212529;
      color: #ffffff;
      text-align: center;
    }
    td {
      background-color: #ffffff;
      color: #212529;
      text-align: left;
      vertical-align: middle;
    }
    td.destacado {
      background-color: #fff3cd;
      font-weight: bold;
    }
    @media (max-width: 768px) {
      .form-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card p-4">
      <h1 class="card-title text-center mb-4">Simulador de Investimentos em Títulos Imobiliários</h1>
      <p class="text-center text-muted">Todos os rendimentos e dividendos serão automaticamente reinvestidos.</p>
      <form id="simuladorForm">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="titulo">Título</label>
            <input list="titulosList" class="form-control" id="titulo" placeholder="Escolha ou digite..." required>
            <datalist id="titulosList">
              <option value="CRI XP Malls" />
              <option value="CRA Agronegócio Safra" />
              <option value="FII ABCP11" />
              <option value="FII KNRI11" />
            </datalist>
          </div>
          <div class="col-md-4">
            <label for="preco">Preço Cota (R$)</label>
            <input type="number" step="0.01" class="form-control" id="preco" required />
          </div>
          <div class="col-md-4">
            <label for="yieldAnual">Yield Anual (%)</label>
            <input type="number" step="0.01" class="form-control" id="yieldAnual" required />
          </div>
        </div>
        <div class="row g-3 mt-2">
          <div class="col-md-2">
            <label for="quantidadeInicial">Cotas Possuídas</label>
            <input type="number" step="0.0001" class="form-control" id="quantidadeInicial" placeholder="0" />
          </div>
          <div class="col-md-2">
            <label for="aporte">Aporte (R$)</label>
            <input type="number" step="0.01" class="form-control" id="aporte" required />
          </div>
          <div class="col-md-3">
            <label for="pagamentoCota">Pagto/Cota (R$)<small class="text-muted"> (opcional)</small></label>
            <input type="number" step="0.0001" class="form-control" id="pagamentoCota" placeholder="ex: 0.095" />
          </div>
          <div class="col-md-2">
            <label for="duracao">Duração (anos)</label>
            <input type="number" class="form-control" id="duracao" placeholder="1" min="1" required />
          </div>
        </div>
        <div class="mt-4">
          <button type="submit" class="btn btn-primary w-100">Simular</button>
        </div>
      </form>
    </div>

    <div id="resultado" style="display:none;">
      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead>
            <tr>
              <th>Mês</th>
              <th>Aporte</th>
              <th>Dividendos</th>
              <th>Reinvestimento</th>
              <th>Cotas Compradas</th>
              <th>Total de Cotas</th>
              <th>Valor Total</th>
              <th>Acumulado (Aporte + Reinvestimento)</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const fmtCurrency = value => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);

    document.getElementById('simuladorForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const duracao = parseInt(document.getElementById('duracao').value);
      if (!duracao || duracao < 1) return alert('Informe a duração em anos corretamente.');

      const preco = parseFloat(document.getElementById('preco').value);
      const yieldAnual = parseFloat(document.getElementById('yieldAnual').value) / 100;
      const campoManual = parseFloat(document.getElementById('pagamentoCota').value);
      const pagamentoCota = isNaN(campoManual) ? (yieldAnual / 12) * preco : campoManual;
      const aporte = parseFloat(document.getElementById('aporte').value);
      const qtdInicial = parseFloat(document.getElementById('quantidadeInicial').value) || 0;

      const tbody = document.getElementById('tabelaCorpo');
      tbody.innerHTML = '';

      let current = new Date();
      let totalCotas = qtdInicial;
      let acumulado = 0;
      const totalMeses = duracao * 12;

      for (let i = 0; i < totalMeses; i++) {
        const dividendos = totalCotas * pagamentoCota;
        const reinvest = dividendos + aporte;
        const cotasCompradas = reinvest / preco;
        totalCotas += cotasCompradas;
        const valorTotal = totalCotas * preco;
        acumulado += reinvest;

        const mes = String(current.getMonth() + 1).padStart(2, '0');
        const ano = current.getFullYear();

        const row = `<tr>
          <td class="text-center">${mes}/${ano}</td>
          <td>${fmtCurrency(aporte)}</td>
          <td class="destacado">${fmtCurrency(dividendos)}</td>
          <td>${fmtCurrency(reinvest)}</td>
          <td>${cotasCompradas.toFixed(4)}</td>
          <td>${totalCotas.toFixed(4)}</td>
          <td>${fmtCurrency(valorTotal)}</td>
          <td>${fmtCurrency(acumulado)}</td>
        </tr>`;
        tbody.insertAdjacentHTML('beforeend', row);
        current.setMonth(current.getMonth() + 1);
      }
      document.getElementById('resultado').style.display = 'block';
    });
  </script>
</body>
</html>
